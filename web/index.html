<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>PWL by Kotecy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="titlebar">
      <div class="drag-zone pywebview-drag-region">
        <span class="brand-icon" aria-hidden="true">P</span>
        <span class="brand-name">PWL by Kotecy</span>
      </div>
      <div class="window-actions">
        <button id="themeButton" class="title-button theme-button" type="button" aria-label="Переключить тему"></button>
        <button id="minimizeButton" class="title-button" type="button" aria-label="Свернуть">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg>
        </button>
        <button id="closeButton" class="title-button close-button" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>

    <main id="welcomeScreen" class="screen welcome-screen">
      <div class="ambient-glow" aria-hidden="true"></div>
      <section class="welcome-card">
        <span class="product-pill">PERFECT WORLD</span>
        <h1>Добро пожаловать в PWL</h1>
        <p class="lead">Автоматический вход в аккаунт без .bat-файлов<br>и ручного ввода паролей</p>
        <div class="divider"></div>
        <p class="prompt">Добавьте прямо сейчас свой<br>первый сервер и аккаунт</p>
        <button id="acceptButton" class="primary-button" type="button">Принять</button>
      </section>
      <span id="welcomeVersion" class="welcome-version"></span>
    </main>

    <main id="workspaceScreen" class="screen workspace-screen" hidden>
      <section class="workspace-heading">
        <h1>Серверы и аккаунты</h1>
        <p>Управляйте входом в любой из своих аккаунтов</p>
      </section>
      <section class="empty-card">
        <span class="plus-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <h2>Здесь пока пусто</h2>
        <p>Добавьте первый сервер, чтобы начать</p>
        <button class="primary-button add-button" type="button">Добавить сервер</button>
      </section>
      <span id="workspaceVersion" class="workspace-version"></span>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
