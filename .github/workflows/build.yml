name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Core tests
        run: cargo test -p pwl-core --locked

      - name: UI smoke test
        shell: pwsh
        run: |
          npm ci --prefix tools
          node tools/smoke-ui.mjs

      - name: UI bundle contract (files, CSP)
        run: node tools/build-assets.mjs

  build:
    name: Executable
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Тег ${{ github.ref_name }} не совпадает с версией $version в tauri.conf.json"
          }

      - name: Cache Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      # Без установщика: приложение — один самодостаточный exe (интерфейс вшит внутрь).
      - name: Build executable
        working-directory: src-tauri
        run: cargo tauri build --no-bundle --ci

      - name: Name the executable
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/pwl.exe "dist/PWL_${version}_x64.exe"
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
          (Get-FileHash dist/*.exe -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWL-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PWL ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*.exe
