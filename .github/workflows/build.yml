name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install "pywebview>=5.4,<7" pyinstaller "pystray>=0.19,<1" "pillow>=10"

      - name: Build PWL.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PWL `
            --icon "web/launcher.ico" `
            --add-data "web;web" `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            --exclude-module wx `
            --exclude-module gi `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exclude-module doctest `
            --exclude-module test `
            main.py

      - name: Report size
        shell: pwsh
        run: "Get-Item dist/PWL.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWL-windows
          path: dist/PWL.exe

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PWL latest build
          files: dist/PWL.exe
