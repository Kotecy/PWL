name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build PWL.exe
        run: pyinstaller --noconfirm --onefile --windowed --name PWL main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PWL-windows
          path: dist/PWL.exe

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PWL latest build
          files: dist/PWL.exe
